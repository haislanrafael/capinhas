<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Capinhas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Controle de Capinhas de Celular</h1>
  </header>

  <main>
    <!-- Formulário para adicionar reposições -->
    <section id="reposicao">
      <h2>Adicionar Reposição</h2>
      <form id="form-reposicao">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" required placeholder="Ex: iPhone 13 Pro">

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" required placeholder="Ex: 10">

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <!-- Tabela de estoque -->
    <section id="estoque">
      <h2>Estoque de Capinhas</h2>
      <table id="tabela-estoque">
        <thead>
          <tr>
            <th>Modelo</th>
            <th>Quantidade</th>
            <th>Última Reposição</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="lista-capinhas">
          <!-- Dados gerados pelo JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
